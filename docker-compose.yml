# MongoDB for ./start-local.sh, which runs the backend and frontend on this
# machine. The credentials below are throwaway defaults for the local container.
services:
  mongodb:
    image: mongo:8.0
    ports:
      # Loopback only: with throwaway root credentials, the database must not
      # be reachable from the network.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    restart: unless-stopped

volumes:
  mongodb_data:
